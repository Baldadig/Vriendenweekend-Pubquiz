<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — De Grote Vriendenweekend Pubquiz</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Bungee&family=Oswald:wght@600;700&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{--paper:#f6efdc;--paper2:#fffaef;--ink:#181320;--red:#e23b2e;--blue:#2438c8;--yellow:#f5b417;--teal:#1aa39a;
    --display:'Archivo Black',Impact,sans-serif;--pop:'Bungee',Impact,sans-serif;--head:'Oswald',sans-serif;--body:'Space Grotesk',system-ui,sans-serif;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--body);color:var(--ink);background:var(--paper);background-image:radial-gradient(rgba(24,19,32,.05) 1px,transparent 1.4px);background-size:15px 15px;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6vw;text-align:center}
  .card{max-width:620px;width:100%;display:flex;flex-direction:column;align-items:center;gap:.6em}
  .stripe{width:100%;height:8px;border-radius:4px;background:repeating-linear-gradient(90deg,var(--red) 0 18px,var(--blue) 18px 36px,var(--yellow) 36px 54px,var(--ink) 54px 72px)}
  .big{font-family:var(--pop);font-size:clamp(4rem,18vw,9rem);color:var(--blue);text-shadow:5px 5px 0 var(--ink);line-height:.9;margin-top:.1em}
  h1{font-family:var(--display);text-transform:uppercase;color:var(--red);text-shadow:3px 3px 0 var(--ink);font-size:clamp(1.3rem,5vw,2.2rem);line-height:1}
  p{font-weight:600;font-size:clamp(.95rem,2.5vw,1.15rem);max-width:34ch}
  a.btn{font-family:var(--head);font-weight:700;text-transform:uppercase;letter-spacing:.05em;text-decoration:none;border:3px solid var(--ink);border-radius:9px;padding:.6em 1.5em;color:#fff;background:var(--red);box-shadow:5px 5px 0 var(--ink);margin-top:.4em}
  a.btn:hover{transform:translate(-1px,-1px)}
  .foot{font-family:var(--head);font-weight:600;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;color:#8a8276;margin-top:.4em}
</style>
</head>
<body>
  <div class="card">
    <div class="stripe"></div>
    <div class="big">404</div>
    <h1>Verdwaald op het vriendenweekend</h1>
    <p>Deze pagina bestaat niet (of de antwoorden zijn goed verstopt 🤫). Terug naar de quiz?</p>
    <a class="btn" href="/">← Naar de quiz</a>
    <div class="stripe"></div>
    <div class="foot">De Grote Vriendenweekend Pubquiz 2026 · hosted bij Lotte &amp; Alex</div>
  </div>
</body>
</html>
